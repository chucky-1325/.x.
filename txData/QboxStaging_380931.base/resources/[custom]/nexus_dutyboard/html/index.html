<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Dutyboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="duty-shell" id="dutyShell">
    <div class="board">
        <div class="board-header">
            <div class="brand">
                <span>NEXUS TALLER</span>
                <strong>Tablon de Turnos</strong>
            </div>
            <button type="button" class="board-close" id="dutyClose">&times;</button>
        </div>

        <div class="board-body" id="dutyBody"></div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
